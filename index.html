<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的个人网站</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      line-height: 1.8;
      background: #f6f4ee;
      color: #253c32;
    }
    main { max-width: 960px; margin: auto; padding: 40px 24px; }
    header { padding: 40px 0; }
    h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.3; }
    h2 { margin-top: 40px; }
    .button {
      display: inline-block;
      padding: 10px 22px;
      background: #285943;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    .button:hover { background: #193e2e; }
    .button:focus-visible { outline: 3px solid #bb7a20; outline-offset: 4px; }
    .cards { display: grid; gap: 16px; }
    article {
      padding: 24px;
      background: white;
      border: 1px solid #dedfd6;
      border-radius: 12px;
    }
    article h3 { margin-top: 0; }
    footer { margin-top: 48px; padding-bottom: 32px; }
    @media (min-width: 700px) {
      .cards { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

<body>
  <main>
    <!-- 第一部分：自我介绍 -->
    <header>
      <p>学习 · 创作 · 记录</p>
      <h1>把想法，一点点做出来。</h1>
      <p>你好，我是 keluoluo0706。我正在学习用 AI 和 GitHub 制作自己的作品。</p>
      <a class="button" href="#works">看看我的作品</a>
    </header>

    <!-- 第二部分：作品展示 -->
    <section id="works">
      <h2>我的作品与计划</h2>
      <div class="cards">
        <article>
          <h3>01 · 个人网站</h3>
          <p>正在制作：用 AI 编写页面，用 GitHub 记录每一次进步。</p>
        </article>
        <article>
          <h3>02 · 自动化小工具</h3>
          <p>计划学习：制作一个帮助我整理文件、减少重复操作的小工具。</p>
        </article>
        <article>
          <h3>03 · AI 项目体验</h3>
          <p>计划学习：找到一个感兴趣的开源 AI 项目，把它运行起来。</p>
        </article>
      </div>
    </section>

    <!-- 第三部分：个人主页入口 -->
    <footer>
      <h2>找到我</h2>
      <p>欢迎到我的 GitHub 主页查看项目和学习记录。</p>
      <a class="button" href="https://github.com/keluoluo0706">
        访问我的 GitHub
      </a>
    </footer>
  </main>
</body>
</html>
